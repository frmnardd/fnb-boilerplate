# ===================================================================
# FnB White-Label Boilerplate - Production Nginx Server Block
# Optimized for Ubuntu 24.04 LTS, PHP 8.3-FPM, Gzip, & HTTP/2
# Placeholders: {{CLIENT_DOMAIN}}, {{CLIENT_ROOT}}
# ===================================================================

server {
    listen 80;
    listen [::]:80;
    server_name {{CLIENT_DOMAIN}} www.{{CLIENT_DOMAIN}};

    # Root strictly points to public/ to secure backend code & config
    root {{CLIENT_ROOT}}/public;
    index index.php index.html;

    # Maximum file upload size (matches 5MB image uploader limit)
    client_max_body_size 10M;

    # Logging
    access_log /var/log/nginx/{{CLIENT_DOMAIN}}.access.log;
    error_log /var/log/nginx/{{CLIENT_DOMAIN}}.error.log warn;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression Optimization
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # Front Controller / Simple Router (PHP Native)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static Assets & WebP Image Caching (30 Days)
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|css|js|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # Direct Web Serving for Uploaded WebP Images
    location /uploads/ {
        alias {{CLIENT_ROOT}}/storage/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # PHP 8.3-FPM FastCGI Execution
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # FastCGI Buffering & Timeouts
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 60s;
        fastcgi_send_timeout 60s;
    }

    # Deny access to hidden files (.env, .git, .htaccess)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block direct access to internal application directories
    location ~ ^/(config|database|storage|views|scripts|tests)/ {
        deny all;
        return 404;
    }
}
